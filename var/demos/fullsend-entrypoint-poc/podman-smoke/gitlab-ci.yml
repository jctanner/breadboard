stages:
  - validate

podman_smoke:
  stage: validate
  image: quay.io/aipcc/agentic-ci/podman:latest
  tags:
    - aipcc-small-x86_64
  before_script:
    - ': > /etc/subuid'
    - ': > /etc/subgid'
    - "printf '[storage]\\ndriver = \"vfs\"\\n' > /etc/containers/storage.conf"
  script:
    - SMOKE_WORKSPACE="$CI_PROJECT_DIR" SMOKE_NETWORK_MODE=host SMOKE_CGROUPS_MODE=disabled sh scripts/podman-smoke.sh
  artifacts:
    when: always
    paths:
      - nested.txt
