name: run-test
description: "One run of one test under one variant: seed Jira, run the design as a dashboard job, check the result"

steps:
  - name: select_arm
    type: set_fact
    vars:
      arm: "{{ arms[test.arm] }}"

  - name: describe_run
    description: "Everything that identifies this run, recorded with its result"
    type: set_fact
    vars:
      run:
        id: "r{{ round }}-{{ test.id }}-{{ variant }}"
        tier: "{{ tier }}"
        test: "{{ test.id }}"
        arm: "{{ test.arm }}"
        variant: "{{ variant }}"
        model: "{{ models[variant] }}"
        repeat: "{{ round }}"
        scenario: "{{ test.scenario }}"
        strat_creator_ref: "{{ arm.strat_creator_ref }}"
        breadboard_ref: "{{ bench_ref }}"
        mlflow_experiment: "strat-workflow-eval/{{ tier }}/{{ test.id }}/{{ variant }}"

  # Seed: a script job resets Jira and creates the scenario's RFEs, using the
  # eligibility rules of the strat-creator commit under test.
  - name: submit_seed
    type: dashboard_api
    params:
      path: /api/jobs/submit
      method: POST
      body:
        script:
          repo: "{{ breadboard_repo }}"
          ref: "{{ bench_ref }}"
          path: var/benchmarks/strat-workflow/scripts/seed_scenario.py
          args: ["--scenario", "{{ run.scenario }}", "--strat-creator-ref", "{{ run.strat_creator_ref }}"]
        args:
          model: claude-haiku-5-5
          mlflow: false
          otel: false
          api_dump: false
    register: seed_job

  - name: wait_for_seed
    type: job_wait
    params:
      job_name: "{{ seed_job.body.job_name }}"

  - name: read_seed_report
    type: dashboard_api
    params:
      path: "/api/files/read?path=/app/artifacts/scripts/{{ seed_job.body.job_name }}/seed.json"
      method: GET
    register: seed_file

  - name: load_seed_report
    type: set_fact
    vars:
      seed: "{{ seed_file.body.content | from_json }}"

  - name: check_seed
    description: "Jira holds the scenario, and the commit's own discovery finds exactly the eligible RFEs"
    type: assert
    that:
      - "seed.ok"
      - "seed.rfes.0.eligible"
    msg: "Seeding {{ run.scenario }} failed its check; see the seed job's log"

  - name: set_rfe
    type: set_fact
    vars:
      rfe_key: "{{ seed.rfes.0.key }}"

  # The design itself, as it is: one script job, nothing between it and its output.
  - name: submit_workflow_arm
    description: "PR #83: run-workflow.sh runs pre-strategy.sh, the Workflow once, PR #83's checker and post step, and releases locks"
    when: "test.arm == 'workflow'"
    type: dashboard_api
    params:
      path: /api/jobs/submit
      method: POST
      body:
        script:
          repo: "{{ breadboard_repo }}"
          ref: "{{ bench_ref }}"
          path: var/benchmarks/strat-workflow/scripts/run-workflow.sh
          args: ["{{ rfe_key }}"]
        args:
          model: "{{ run.model }}"
          mlflow_experiment: "{{ run.mlflow_experiment }}"
          strace: true
          extra_env:
            STRAT_CREATOR_REF: "{{ arm.strat_creator_ref }}"
            STRAT_ARCHITECTURE_CONTEXT_PATH: "{{ architecture_context_path }}"
    register: workflow_job

  - name: submit_bash_arm
    description: "PR #80: its strategy-entrypoint.sh, unchanged apart from the eval patches, from the strat-creator clone"
    when: "test.arm == 'bash'"
    type: dashboard_api
    params:
      path: /api/jobs/submit
      method: POST
      body:
        script:
          repo: "{{ arm.repo }}"
          ref: "{{ arm.strat_creator_ref }}"
          path: .fullsend/scripts/strategy-entrypoint.sh
          args: ["{{ rfe_key }}"]
        args:
          model: "{{ run.model }}"
          mlflow_experiment: "{{ run.mlflow_experiment }}"
          strace: true
          extra_env:
            STRAT_MODEL: "{{ run.model }}"
            STRAT_ARCHITECTURE_CONTEXT_PATH: "{{ architecture_context_path }}"
            CLAUDE_CONFIG_DIR: /home/pipelineagent/.claude
            RESULTS_REPO_URL: "{{ arm.results_repo_url }}"
            RESULTS_GIT_USER: "{{ arm.results_git_user }}"
            RESULTS_PUSH_TOKEN: "{{ arm.results_push_token }}"
    register: bash_job

  - name: set_job
    type: set_fact
    vars:
      job_name: "{{ workflow_job.body.job_name | default:bash_job.body.job_name }}"

  - name: wait_for_run
    description: "A failed job is a failed test: record it and go on to the checks"
    type: job_wait
    ignore_errors: true
    params:
      job_name: "{{ job_name }}"
      timeout: "{{ job_timeout }}"
    register: run_job

  - name: stop_unfinished_run
    description: "Stop a job still going at the timeout, before the next run resets Jira under it"
    when: "run_job.failed and run_job.status != 'failed'"
    type: dashboard_api
    params:
      path: "/api/jobs/{{ job_name }}/stop"
      method: POST
      body: {}

  - name: check
    description: "Script checks on Jira and the job, plus usage from the API dumps: the run's eval-result"
    type: bench_script
    params:
      path: check_run.py
      args: ["{{ run | to_json }}", "{{ job_name }}", "{{ rfe_key }}", "{{ run_job.status }}"]
    register: eval
