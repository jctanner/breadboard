# The name is historical: this deployment began as the lightweight site-scoped
# router shim (ledger M12-024) and was replaced in M12-025 by upstream GitHub
# Actions runner 2.317.0 registered at ENTERPRISE scope. Read RUNNER_SCOPE and
# RUNNER_NAME below rather than the object name — it registers as
# `breadboard-enterprise-router`, not `breadboard-site-router`, and the site
# shim no longer exists.
#
# Renaming the deployment would mean deleting and recreating it and touching
# the deploy ordering, so the name stays and this note carries the truth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-site-runner
  namespace: ai-pipeline
  labels:
    app: github-actions-site-runner
    breadboard.dev/role: fullsend-router
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: github-actions-site-runner
  template:
    metadata:
      labels:
        app: github-actions-site-runner
        breadboard.dev/role: fullsend-router
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: runner
          image: github-emulator-actions-real-runner:k3s
          imagePullPolicy: Never
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp /etc/breadboard-ca/ca.crt /usr/local/share/ca-certificates/breadboard-internal-ca.crt
              update-ca-certificates
              exec /entrypoint.sh
          env:
            - name: GITHUB_EMULATOR_URL
              value: https://github.local
            - name: GITHUB_EMULATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-actions-runner-credentials
                  key: token
            - name: RUNNER_SCOPE
              value: enterprise
            - name: RUNNER_ENTERPRISE
              value: breadboard
            - name: RUNNER_NAME
              value: breadboard-enterprise-router
            # The hosted-runner stand-in (runner-consolidation-plan, phase 1).
            # On real GitHub a self-hosted runner would not claim ubuntu labels,
            # since GitHub supplies hosted runners. There are none here, so any
            # ordinary workflow queues forever with nothing reporting why — and
            # ubuntu-24.04 is not an arbitrary label: it is Fullsend's own
            # default runner_image.
            #
            # Only labels this image can honestly satisfy. It is genuinely
            # Ubuntu 24.04 (src/runners/upstream/Dockerfile); ubuntu-22.04 came
            # off with the rebase, because a label list has to describe the
            # image. ubuntu-latest is claimed on the same basis and will need
            # revisiting when GitHub moves it.
            #
            # fullsend-router came off in phase 3 with the deprecated org-mode
            # .fullsend/dispatch.yml, the only thing that ever targeted it.
            # Fullsend routing runs on the agent runner via inputs.runner_image.
            #
            # Single replica, and a runner goes busy while it runs a job.
            - name: RUNNER_LABELS
              value: self-hosted,linux,ubuntu-latest,ubuntu-24.04
            # The workspace and RUNNER_TEMP are siblings under one
            # volume, as they are on GitHub. RUNNER_TEMP has to sit outside the
            # workspace: a checkout with no path: makes the workspace root a
            # git working tree, and a source build unpacked into it would land
            # inside that repository.
            - name: RUNNER_WORKDIR
              value: /runner-root/workspace
            - name: GIT_SSL_CAINFO
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            # JavaScript actions run on the runner's bundled Node, which
            # reads neither the system store nor SSL_CERT_FILE. Without this
            # a checkout against github.local fails with
            # UNABLE_TO_VERIFY_LEAF_SIGNATURE while git, on the same pod,
            # succeeds.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/breadboard-ca/ca.crt
            - name: RUNNER_ALLOW_RUNASROOT
              value: "1"
          volumeMounts:
            - name: runner-work
              mountPath: /runner-root
            - name: breadboard-ca
              mountPath: /etc/breadboard-ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 0
      volumes:
        - name: runner-work
          emptyDir: {}
        - name: breadboard-ca
          configMap:
            name: internal-ca-cert
