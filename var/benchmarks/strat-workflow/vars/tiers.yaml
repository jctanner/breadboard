# Test lists per tier. Each test runs one design (an arm, vars/arms.yaml) on
# one scenario (data/scenarios/<scenario>.yaml) under its variants
# (vars/models.yaml). Repeats run in rounds, all tests once and then again,
# so the designs alternate.
tiers:
  s1-mixed-glm:
    single_test: true
    variant: glm
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [glm]
        scenario: batch-mixed-state
        mode: batch
        batch_size: 10
        repo: https://github.com/jctanner-fullsend-ai/strat-creator.git
        strat_creator_ref: fbc335bedb4a4eb97265da89d36bc29009a41fde
        workflow_max_concurrent_agents: 10
        timeout_minutes: 295
        capture_native: true
  s1-hardening-glm:
    single_test: true
    variant: glm
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [glm]
        scenario: batch-ten-new-rfes
        mode: batch
        batch_size: 10
        # Fullsend PR #85 / feat/s1-workflow-hardening, pinned for reproducibility.
        repo: https://github.com/jctanner-fullsend-ai/strat-creator.git
        strat_creator_ref: 6a05210215247b287bb0fb61ed02e423c9de8692
        workflow_max_concurrent_agents: 10
        timeout_minutes: 295
        capture_native: true
  s1-hardening-opus:
    single_test: true
    variant: opus
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [opus]
        scenario: batch-ten-new-rfes
        mode: batch
        batch_size: 10
        # Same candidate as GLM; Opus still needs separate run authorization.
        repo: https://github.com/jctanner-fullsend-ai/strat-creator.git
        strat_creator_ref: 6a05210215247b287bb0fb61ed02e423c9de8692
        workflow_max_concurrent_agents: 10
        timeout_minutes: 295
        capture_native: true
  glm-smoke:
    # Exactly one RFE/run per selected arm. Archive/analyze S1 before S2.
    single_test: true
    variant: glm
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [glm]
        scenario: smoke-one-rfe
      - id: S2
        arm: bash
        variants: [glm]
        scenario: smoke-one-rfe
  tier2-smoke:
    # Select exactly one design explicitly. S1 first; S2 only after analysis.
    single_test: true
    variant: haiku
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [haiku]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
      - id: S2
        arm: bash
        variants: [haiku]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
  tier2-opus:
    # A separately authorized Opus pass; the Haiku smoke tier stays unchanged.
    single_test: true
    variant: opus
    repeats: 1
    tests:
      - id: S1
        arm: workflow
        variants: [opus]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
      - id: S2
        arm: bash
        variants: [opus]
        scenario: batch-three-new-rfes
        mode: batch
        batch_size: 3
  smoke:
    # One eligible RFE, start to finish, through each design.
    repeats: 3
    tests:
      - id: S1
        arm: workflow
        variants: [haiku]
        scenario: smoke-one-rfe
      - id: S2
        arm: bash
        variants: [haiku]
        scenario: smoke-one-rfe
      - id: S3
        arm: workflow
        variants: [opus]
        scenario: smoke-one-rfe
      - id: S4
        arm: bash
        variants: [opus]
        scenario: smoke-one-rfe
