# The name is historical: this deployment began as the lightweight site-scoped
# router shim (ledger M12-024) and was replaced in M12-025 by upstream GitHub
# Actions runner 2.317.0 registered at ENTERPRISE scope. Read RUNNER_SCOPE and
# RUNNER_NAME below rather than the object name — it registers as
# `breadboard-enterprise-router`, not `breadboard-site-router`, and the site
# shim no longer exists.
#
# Renaming the deployment would mean deleting and recreating it and touching
# the deploy ordering, so the name stays and this note carries the truth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-site-runner
  namespace: ai-pipeline
  labels:
    app: github-actions-site-runner
    breadboard.dev/role: fullsend-router
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: github-actions-site-runner
  template:
    metadata:
      labels:
        app: github-actions-site-runner
        breadboard.dev/role: fullsend-router
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: runner
          image: github-emulator-actions-real-runner:k3s
          imagePullPolicy: Never
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp /etc/breadboard-ca/ca.crt /usr/local/share/ca-certificates/breadboard-internal-ca.crt
              update-ca-certificates
              exec /entrypoint.sh
          env:
            - name: GITHUB_EMULATOR_URL
              value: https://github.local
            - name: GITHUB_EMULATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-actions-runner-credentials
                  key: token
            - name: RUNNER_SCOPE
              value: enterprise
            - name: RUNNER_ENTERPRISE
              value: breadboard
            - name: RUNNER_NAME
              value: breadboard-enterprise-router
            # fullsend-router is what Fullsend's shim targets. The ubuntu
            # labels are here because nothing else in this stack serves them:
            # on real GitHub a self-hosted runner would not claim them, since
            # GitHub supplies hosted runners, but there are none here, so any
            # ordinary workflow — including the agents mirror's own CI —
            # queues forever with nothing reporting why.
            #
            # Only labels this image can honestly satisfy: it is genuinely
            # Ubuntu 22.04.5 (see src/runners/upstream/Dockerfile). ubuntu-24.04
            # is deliberately absent rather than claimed and then failing in
            # confusing ways; workflows asking for it still queue, which is the
            # honest outcome until something actually runs 24.04.
            #
            # The cost: this is a single replica whose real job is dispatch,
            # and a runner goes busy while it runs a job. A long CI job will
            # delay routing. If that starts to bite, the answer is a separate
            # runner for hosted-label work rather than more labels here.
            - name: RUNNER_LABELS
              value: self-hosted,linux,ubuntu-latest,ubuntu-22.04,fullsend-router
            # The workspace and RUNNER_TEMP are siblings under one
            # volume, as they are on GitHub. RUNNER_TEMP has to sit outside the
            # workspace: a checkout with no path: makes the workspace root a
            # git working tree, and a source build unpacked into it would land
            # inside that repository.
            - name: RUNNER_WORKDIR
              value: /runner-root/workspace
            - name: GIT_SSL_CAINFO
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: RUNNER_ALLOW_RUNASROOT
              value: "1"
          volumeMounts:
            - name: runner-work
              mountPath: /runner-root
            - name: breadboard-ca
              mountPath: /etc/breadboard-ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 0
      volumes:
        - name: runner-work
          emptyDir: {}
        - name: breadboard-ca
          configMap:
            name: internal-ca-cert
