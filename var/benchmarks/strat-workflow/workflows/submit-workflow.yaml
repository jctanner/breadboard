name: submit-workflow
description: "PR #83, the Claude Workflow: run-workflow.sh runs pre-strategy.sh, the Workflow once, PR #83's checker and post step, and releases locks"

steps:
  - name: submit_job
    when: "variant != 'glm'"
    type: dashboard_api
    params:
      path: /api/jobs/submit
      method: POST
      body:
        script:
          repo: "{{ breadboard_repo }}"
          ref: "{{ bench_ref }}"
          path: var/benchmarks/strat-workflow/scripts/run-workflow.sh
          args: ["{{ rfe_key }}"]
        args:
          model: "{{ run.model }}"
          mlflow_experiment: "{{ run.mlflow_experiment }}"
          strace: true
          extra_env:
            STRAT_CREATOR_REPO: "{{ run.strat_creator_repo }}"
            STRAT_CREATOR_REF: "{{ run.strat_creator_ref }}"
            STRAT_ARCHITECTURE_CONTEXT_PATH: "{{ architecture_context_path }}"
            STRAT_BG_WAIT_CEILING_MS: "{{ workflow_bg_wait_ceiling_ms }}"
            BATCH_SIZE: "{{ run.batch_size }}"
            BATCH_EXPECTED_KEYS: "{{ batch_expected_keys }}"
            STRAT_MIXED_SEED_JSON: "{% if run.scenario == 'batch-mixed-state' or run.scenario == 'batch-mixed-ten-distinct-v2' %}/app/artifacts/scripts/{{ seed_job.body.job_name }}/seed.json{% endif %}"
            STRAT_TIMEOUT_MINUTES: "{{ test.timeout_minutes | default:90 }}"
            STRAT_CAPTURE_NATIVE: "{% if test.capture_native %}1{% else %}0{% endif %}"
            STRAT_STOP_ON_WORKFLOW_FAILURE: "{% if test.stop_on_workflow_failure %}1{% else %}0{% endif %}"
            CLAUDE_CODE_WORKFLOW_MAX_CONCURRENT_AGENTS: "{{ run.workflow_max_concurrent_agents }}"
    register: job

  - name: submit_glm_job
    when: "variant == 'glm'"
    type: dashboard_api
    params:
      path: /api/jobs/submit
      method: POST
      body:
        script:
          repo: "{{ breadboard_repo }}"
          ref: "{{ bench_ref }}"
          path: var/benchmarks/strat-workflow/scripts/run-workflow.sh
          args: ["{{ rfe_key }}"]
        args:
          model: "{{ run.model }}"
          mlflow_experiment: "{{ run.mlflow_experiment }}"
          strace: true
          extra_env:
            STRAT_CREATOR_REPO: "{{ run.strat_creator_repo }}"
            STRAT_CREATOR_REF: "{{ run.strat_creator_ref }}"
            STRAT_ARCHITECTURE_CONTEXT_PATH: "{{ architecture_context_path }}"
            STRAT_BG_WAIT_CEILING_MS: "{{ workflow_bg_wait_ceiling_ms }}"
            BATCH_SIZE: "{{ run.batch_size }}"
            BATCH_EXPECTED_KEYS: "{{ batch_expected_keys }}"
            STRAT_MIXED_SEED_JSON: "{% if run.scenario == 'batch-mixed-state' or run.scenario == 'batch-mixed-ten-distinct-v2' %}/app/artifacts/scripts/{{ seed_job.body.job_name }}/seed.json{% endif %}"
            STRAT_TIMEOUT_MINUTES: "{{ test.timeout_minutes | default:90 }}"
            STRAT_CAPTURE_NATIVE: "{% if test.capture_native %}1{% else %}0{% endif %}"
            STRAT_STOP_ON_WORKFLOW_FAILURE: "{% if test.stop_on_workflow_failure %}1{% else %}0{% endif %}"
            CLAUDE_CODE_WORKFLOW_MAX_CONCURRENT_AGENTS: "{{ run.workflow_max_concurrent_agents }}"
            CLAUDE_CODE_SUBAGENT_MODEL: "{{ run.model }}"
            ANTHROPIC_DEFAULT_OPUS_MODEL: "{{ run.model }}"
            ANTHROPIC_DEFAULT_SONNET_MODEL: "{{ run.model }}"
            ANTHROPIC_DEFAULT_HAIKU_MODEL: "{{ run.model }}"
            ANTHROPIC_DEFAULT_FABLE_MODEL: "{{ run.model }}"
            CLAUDE_CODE_EFFORT_LEVEL: "medium"
            STRAT_EFFORT: "medium"
    register: job
