apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-actions-runner
  namespace: ai-pipeline
  labels:
    app: github-actions-runner
    breadboard.dev/role: fullsend
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: github-actions-runner
  template:
    metadata:
      labels:
        app: github-actions-runner
        breadboard.dev/role: fullsend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: runner
          image: fullsend-runner-dev:k3s
          imagePullPolicy: Never
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp /etc/breadboard-ca/ca.crt /usr/local/share/ca-certificates/breadboard-internal-ca.crt
              update-ca-certificates
              exec python /app/runner.py
          env:
            - name: GITHUB_EMULATOR_URL
              value: https://github.local
            - name: GITHUB_EMULATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-actions-runner-credentials
                  key: token
            - name: RUNNER_REPO
              value: fullsend-dev/triage-target
            - name: RUNNER_NAME
              value: fullsend-dev-runner
            - name: RUNNER_LABELS
              value: self-hosted,linux,fullsend
            # The workspace and RUNNER_TEMP are siblings under one
            # volume, as they are on GitHub. RUNNER_TEMP has to sit outside the
            # workspace: a checkout with no path: makes the workspace root a
            # git working tree, and a source build unpacked into it would land
            # inside that repository.
            - name: RUNNER_WORKDIR
              value: /runner-root/workspace
            - name: GIT_SSL_CAINFO
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            # The emulator is only reachable on a cluster address, which the
            # CLI's SSRF-hardened fetcher refuses by default. This exempts that
            # one host and nothing else; see patch 0006.
            - name: FULLSEND_ALLOW_PRIVATE_FORGE
              value: "1"
            - name: FULLSEND_MINT_URL
              value: http://fullsend-mint-dev.ai-pipeline.svc.cluster.local:8080
            - name: CLAUDE_CODE_USE_VERTEX
              valueFrom:
                secretKeyRef:
                  name: pipeline-secrets
                  key: CLAUDE_CODE_USE_VERTEX
                  optional: true
            - name: CLOUD_ML_REGION
              valueFrom:
                secretKeyRef:
                  name: pipeline-secrets
                  key: CLOUD_ML_REGION
                  optional: true
            - name: ANTHROPIC_VERTEX_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: pipeline-secrets
                  key: ANTHROPIC_VERTEX_PROJECT_ID
                  optional: true
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/gcp/credentials.json
            - name: OPENSHELL_GATEWAY_ENDPOINT
              value: http://openshell.openshell-system.svc.cluster.local:8080
            - name: OPENSHELL_GATEWAY_NAME
              value: openshell
          volumeMounts:
            - name: runner-work
              mountPath: /runner-root
            - name: breadboard-ca
              mountPath: /etc/breadboard-ca
              readOnly: true
            - name: gcp-credentials
              mountPath: /var/run/secrets/gcp
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: runner-work
          emptyDir: {}
        - name: breadboard-ca
          configMap:
            name: internal-ca-cert
        - name: gcp-credentials
          secret:
            secretName: gcp-credentials
            optional: true
