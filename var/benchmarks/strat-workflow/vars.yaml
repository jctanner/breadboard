# Run settings. Override any of them when starting the run (markovd's run
# form, or markov run --var key=value).

# Which test list to run (vars/tiers.yaml).
tier: smoke
# Only these tests, comma-separated (e.g. "S1,S2"); empty runs the whole tier.
only_tests: ""
# Run every test under these variants, comma-separated (e.g. "haiku,opus");
# empty uses each test's own (vars/tiers.yaml, models in vars/models.yaml).
variants: ""
# Repeat count; empty uses the tier's.
repeats: ""

# Breadboard commit the jobs clone their scripts from (run-workflow.sh,
# seed_scenario.py). Empty means the commit markovd imported this workflow
# from, which markovd passes in as workflow_source_commit. It must be a
# pushed, full 40-character commit.
breadboard_ref: ""
workflow_source_commit: ""
breadboard_repo: https://github.com/jctanner/breadboard

# Clear the artifacts volume, MLflow and Observatory once before the first
# run. Between runs only Jira is reset and seeded, so every run's strace, API
# dumps and MLflow traces are kept.
wipe_at_start: true
# Pause at the end for review. markovd can't resume a paused run yet; with
# the CLI, resume with --var reviewed=true.
review_stop: false
reviewed: false

# Seconds to wait for one test's job before stopping it.
job_timeout: 7200

# The pinned architecture-context snapshot on the context volume
# (scripts/snapshot-architecture-context.sh), rhoai-3.6-ea.2.
architecture_context_path: /app/.context/snapshots/architecture-context/7d61f097a9220aeb1280837b66b532177ec558b6

dashboard_base: http://pipeline-dashboard.ai-pipeline.svc.cluster.local:5000
jira_base: https://jira-emulator.ai-pipeline.svc.cluster.local
jira_user: admin
jira_token: admin

# Where write_file steps save results: the pipeline-artifacts volume, which
# markovd mounts into runner pods at the same path as the dashboard.
artifacts_dir: /app/artifacts
