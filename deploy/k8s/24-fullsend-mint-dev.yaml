apiVersion: apps/v1
kind: Deployment
metadata:
  name: fullsend-mint-dev
  namespace: ai-pipeline
  labels:
    app: fullsend-mint-dev
    breadboard.dev/role: fullsend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fullsend-mint-dev
  template:
    metadata:
      labels:
        app: fullsend-mint-dev
        breadboard.dev/role: fullsend
    spec:
      containers:
        - name: mint
          image: fullsend-mint-dev:k3s
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            # The issuer as it appears in the token's "iss" claim, which is
            # the emulator's external URL.
            - name: FULLSEND_OIDC_ISSUER
              value: https://github.local
            # The emulator redirects plain HTTP to TLS, so keys are fetched
            # over HTTPS by the hostname its certificate names.
            - name: FULLSEND_OIDC_JWKS_URL
              value: https://github.local/.well-known/jwks.json
            - name: FULLSEND_OIDC_AUDIENCE
              value: fullsend-mint
            - name: SSL_CERT_FILE
              value: /etc/breadboard-ca/ca.crt
            - name: FULLSEND_MINT_TLS_CERT
              value: /etc/mint-tls/tls.crt
            - name: FULLSEND_MINT_TLS_KEY
              value: /etc/mint-tls/tls.key
            - name: FULLSEND_ROLE_TOKENS
              valueFrom:
                secretKeyRef:
                  name: fullsend-mint-dev-credentials
                  key: role-tokens
          volumeMounts:
            - name: breadboard-ca
              mountPath: /etc/breadboard-ca
              readOnly: true
            - name: mint-tls
              mountPath: /etc/mint-tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: breadboard-ca
          configMap:
            name: internal-ca-cert
        - name: mint-tls
          secret:
            secretName: fullsend-mint-dev-tls
---
apiVersion: v1
kind: Service
metadata:
  name: fullsend-mint-dev
  namespace: ai-pipeline
  labels:
    app: fullsend-mint-dev
spec:
  selector:
    app: fullsend-mint-dev
  ports:
    - name: http
      port: 8080
      targetPort: http
