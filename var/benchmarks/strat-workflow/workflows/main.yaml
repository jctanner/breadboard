name: main
description: "strat-creator design benchmark: run a tier's tests in rounds, check each run, summarize"

steps:
  - name: resolve_settings
    description: "The Breadboard commit the jobs clone from, and the tier's definition"
    type: set_fact
    vars:
      bench_ref: "{% if breadboard_ref %}{{ breadboard_ref }}{% else %}{{ workflow_source_commit }}{% endif %}"
      tier_def: "{{ tiers[tier] }}"

  - name: check_settings
    type: assert
    that:
      - "bench_ref | length == 40"
      - "tier_def.tests"
    msg: "Needs a pushed 40-character Breadboard commit (breadboard_ref, or workflow_source_commit from markovd) and a tier defined in vars/tiers.yaml"

  - name: list_running_jobs
    description: "A reset or a new test would pull Jira and files out from under a job still going"
    type: dashboard_api
    params:
      path: /api/jobs?status=running
      method: GET
    register: running_jobs

  - name: list_pending_jobs
    type: dashboard_api
    params:
      path: /api/jobs?status=pending
      method: GET
    register: pending_jobs

  - name: check_no_active_jobs
    type: assert
    that:
      - "running_jobs.body | length == 0"
      - "pending_jobs.body | length == 0"
    msg: "Dashboard jobs are still pending or running; wait for them or stop them first"

  - name: wipe
    description: "Clear the artifacts volume, MLflow and Observatory once, before the first run"
    when: "wipe_at_start"
    workflow: wipe

  - name: rounds
    description: "Every test once per round, so the designs alternate instead of running back to back"
    for_each: "repeats | default:tier_def.repeats | seq"
    as: round
    concurrency: 1
    workflow: round
    register: rounds_done

  - name: summarize
    description: "One table row per run and one per test, from every run's eval-result"
    type: bench_script
    params:
      path: summarize.py
      args:
        - "{% for r in rounds_done %}{% for t in r.tests_done %}{% for v in t.variants_done %}{{ v.eval.stdout | trim }}\n{% endfor %}{% endfor %}{% endfor %}"
    register: summary

  - name: review
    description: "Pause for review when review_stop is set; resume with reviewed=true"
    type: gate
    rules:
      - review_stop
