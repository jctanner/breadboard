apiVersion: v1
kind: ConfigMap
metadata:
  name: openshell-m2-runner-config
  namespace: gitlab-runner
data:
  config.toml: |
    concurrent = 1
    check_interval = 3

    [[runners]]
      name = "openshell-m2-k8s-runner"
      url = "https://gitlab-emulator.ai-pipeline.svc.cluster.local"
      token = "__RUNNER_TOKEN__"
      tls-ca-file = "/etc/gitlab-runner/certs/ca.crt"
      executor = "kubernetes"
      environment = ["GIT_SSL_CAINFO=/etc/gitlab-runner/certs/ca.crt"]

      [runners.kubernetes]
        namespace = "gitlab-runner"
        image = "quay.io/aipcc/agentic-ci/podman@sha256:672706f01b9d7155d3e4595d7920d6608b7f462674fd1bfcaf5c80ea7e802784"
        poll_timeout = 300
        service_account = "gitlab-runner"
        privileged = true

        [[runners.kubernetes.volumes.secret]]
          name = "gitlab-runner-ca"
          mount_path = "/etc/gitlab-runner/certs"
          read_only = true

        [[runners.kubernetes.volumes.empty_dir]]
          name = "openshell-m2-storage"
          mount_path = "/var/lib/containers"

        [[runners.kubernetes.volumes.empty_dir]]
          name = "openshell-m2-run"
          mount_path = "/run/containers"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshell-m2-gitlab-runner
  namespace: gitlab-runner
  labels:
    app.kubernetes.io/name: openshell-m2-gitlab-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openshell-m2-gitlab-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshell-m2-gitlab-runner
    spec:
      serviceAccountName: gitlab-runner
      containers:
        - name: gitlab-runner
          image: gitlab/gitlab-runner:v19.1.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              RUNNER_TOKEN=$(printf '%s' "$OPENSHELL_M2_RUNNER_TOKEN" | tr -d '\r\n');
              sed "s|__RUNNER_TOKEN__|$RUNNER_TOKEN|" /runner-template/config.toml
              > /tmp/config.toml;
              exec gitlab-runner run --working-directory=/home/gitlab-runner
              --config=/tmp/config.toml --service=gitlab-runner --user=gitlab-runner
          env:
            - name: OPENSHELL_M2_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openshell-m2-runner-token
                  key: token
          volumeMounts:
            - name: runner-template
              mountPath: /runner-template
              readOnly: true
            - name: runner-ca
              mountPath: /etc/gitlab-runner/certs
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: runner-template
          configMap:
            name: openshell-m2-runner-config
        - name: runner-ca
          secret:
            secretName: gitlab-runner-ca
