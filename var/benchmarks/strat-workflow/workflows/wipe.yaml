name: wipe
description: "Clear the artifacts volume, MLflow and Observatory (not Jira, not the context volume)"

steps:
  - name: clear_artifacts
    description: "Job logs, strace, API dumps and script artifacts, with a cleanup job"
    type: dashboard_api
    params:
      path: /api/volumes/clear
      method: POST
      body:
        volumes: [artifacts]
        mode: job
    register: cleared

  - name: wait_for_clear
    type: job_wait
    params:
      job_name: "{{ cleared.body.job_name }}"
      timeout: 600

  - name: clear_mlflow
    description: "Hard-delete every MLflow experiment, run and trace"
    type: dashboard_api
    params:
      path: /api/mlflow/hard-clear
      method: POST
      body: {}

  - name: clear_observatory
    description: "Claims, verdicts and explanations; Observatory can't clear OTel traces, which stay tagged by job"
    type: dashboard_api
    params:
      path: /api/observatory/clear
      method: POST
      body: {}
