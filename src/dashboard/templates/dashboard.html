{% extends "layout.html" %}
{% block title %}Breadboard Tickets{% endblock %}
{% block content %}

<div class="flex items-end justify-between gap-4 mb-6">
  <div>
    <h1 class="text-2xl font-semibold text-gray-900 dark:text-white">Tickets</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Live work items from Jira, GitHub, and GitLab.</p>
  </div>
  <button id="tickets-refresh" type="button" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-primary-600 text-white hover:bg-primary-700 transition-colors">Refresh</button>
</div>

<div id="tickets-filter-bar" class="flex flex-wrap gap-3 mb-4 items-end">
  <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Search
    <input id="tickets-query" type="search" placeholder="key, title, repository, label…" class="mt-1 block w-64 rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200 text-sm py-1.5 px-2.5 focus:ring-primary-500 focus:border-primary-500">
  </label>
  <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Source
    <select id="tickets-source" class="mt-1 block rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200 text-sm py-1.5 px-2.5"><option value="">All</option><option value="jira">Jira</option><option value="github">GitHub</option><option value="gitlab">GitLab</option></select>
  </label>
  <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Type
    <input id="tickets-type" type="search" placeholder="Bug, Story, Epic…" class="mt-1 block w-32 rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200 text-sm py-1.5 px-2.5">
  </label>
  <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Kind
    <select id="tickets-category" class="mt-1 block rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200 text-sm py-1.5 px-2.5"><option value="">All</option><option value="issue">Issue</option><option value="pull_request">Pull request</option><option value="merge_request">Merge request</option></select>
  </label>
  <label class="text-sm font-medium text-gray-700 dark:text-gray-300">State
    <input id="tickets-state" type="search" placeholder="open, closed…" class="mt-1 block w-32 rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200 text-sm py-1.5 px-2.5">
  </label>
  <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Label
    <input id="tickets-label" type="search" placeholder="label" class="mt-1 block w-32 rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200 text-sm py-1.5 px-2.5">
  </label>
  <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Project / repository
    <input id="tickets-project" type="search" placeholder="project or repo" class="mt-1 block w-44 rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200 text-sm py-1.5 px-2.5">
  </label>
</div>

<div id="tickets-errors" class="hidden mb-4 rounded-lg border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-800 dark:border-amber-700 dark:bg-amber-900/20 dark:text-amber-200"></div>

<div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
  <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-700">
    <span id="tickets-count" class="text-sm text-gray-500 dark:text-gray-400">Loading tickets…</span>
    <label class="text-sm text-gray-500 dark:text-gray-400">Per page
      <select id="tickets-page-size" class="ml-1 rounded border-gray-300 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200 text-sm py-1"><option>25</option><option selected>50</option><option>100</option></select>
    </label>
  </div>
  <div class="overflow-x-auto">
    <table class="w-full text-sm text-left" id="tickets-table">
      <thead class="bg-gray-50 dark:bg-gray-800 text-xs uppercase text-gray-500 dark:text-gray-400"><tr>
        <th class="px-4 py-3">Source</th><th class="px-4 py-3">Type</th><th class="px-4 py-3">Key</th><th class="px-4 py-3">Title</th><th class="px-4 py-3">State</th><th class="px-4 py-3">Labels</th><th class="px-4 py-3">Updated</th>
      </tr></thead>
      <tbody id="tickets-body" class="divide-y divide-gray-200 dark:divide-gray-700"></tbody>
    </table>
  </div>
  <div class="flex items-center justify-between px-4 py-3 border-t border-gray-200 dark:border-gray-700">
    <button id="tickets-previous" type="button" class="px-3 py-1.5 rounded-lg text-sm border border-gray-300 dark:border-gray-600 disabled:opacity-40">Previous</button>
    <span id="tickets-page" class="text-sm text-gray-500 dark:text-gray-400"></span>
    <button id="tickets-next" type="button" class="px-3 py-1.5 rounded-lg text-sm border border-gray-300 dark:border-gray-600 disabled:opacity-40">Next</button>
  </div>
</div>
{% endblock %}

{% block scripts %}<script src="/static/js/tickets.js"></script>{% endblock %}
