name: round
description: "One round: each selected test of the tier, one at a time (every run resets the one Jira)"

steps:
  - name: tests
    for_each: tier_def.tests
    for_each_key: id
    for_each_when: "not only_tests or test.id in only_tests | csv"
    as: test
    concurrency: 1
    workflow: test-variants
    register: tests_done
