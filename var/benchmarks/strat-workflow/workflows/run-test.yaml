name: run-test
description: "One run of one test under one variant: seed Jira, run the design as a dashboard job, check the result"

steps:
  - name: select_arm
    type: set_fact
    vars:
      arm: "{{ arms[test.arm] }}"

  - name: describe_run
    description: "Everything that identifies this run, recorded with its result"
    type: set_fact
    vars:
      run:
        id: "r{{ round }}-{{ test.id }}-{{ variant }}"
        tier: "{{ tier }}"
        test: "{{ test.id }}"
        arm: "{{ test.arm }}"
        variant: "{{ variant }}"
        model: "{{ models[variant] }}"
        repeat: "{{ round }}"
        scenario: "{{ test.scenario }}"
        mode: "{{ test.mode | default:'single' }}"
        batch_size: "{{ test.batch_size | default:1 }}"
        strat_creator_ref: "{{ test.strat_creator_ref | default:arm.strat_creator_ref }}"
        breadboard_ref: "{{ bench_ref }}"
        markov_run_id: "{{ markov_run_id }}"
        mlflow_experiment: "strat-workflow-eval/{{ tier }}/{{ test.id }}/{{ variant }}"

  # Seed: a script job resets Jira and creates the scenario's RFEs, using the
  # eligibility rules of the strat-creator commit under test.
  - name: require_archives_before_seed
    description: "Stop before Jira reset if a previous benchmark job lacks a verified host archive"
    type: bench_script
    params:
      path: require_archive.py
      args: ["{{ archive_required_since }}"]

  - name: submit_seed
    type: dashboard_api
    params:
      path: /api/jobs/submit
      method: POST
      body:
        script:
          repo: "{{ breadboard_repo }}"
          ref: "{{ bench_ref }}"
          path: var/benchmarks/strat-workflow/scripts/seed_scenario.py
          args: ["--scenario", "{{ run.scenario }}", "--strat-creator-ref", "{{ run.strat_creator_ref }}"]
        args:
          model: claude-haiku-5-5
          mlflow: false
          otel: false
          api_dump: false
          extra_env:
            STRAT_ARCHIVE_REQUIRED_SINCE: "{{ archive_required_since }}"
    register: seed_job

  - name: wait_for_seed
    type: job_wait
    params:
      job_name: "{{ seed_job.body.job_name }}"

  - name: read_seed_report
    type: dashboard_api
    params:
      path: "/api/files/read?path=/app/artifacts/scripts/{{ seed_job.body.job_name }}/seed.json"
      method: GET
    register: seed_file

  - name: load_seed_report
    type: set_fact
    vars:
      seed: "{{ seed_file.body.content | from_json }}"

  - name: check_seed
    description: "Jira holds the scenario, and the commit's own discovery finds exactly the eligible RFEs"
    type: assert
    that:
      - "seed.ok"
      - "seed.rfes.0.eligible"
      - "seed.discovered | length == run.batch_size"
    msg: "Seeding {{ run.scenario }} failed its check; see the seed job's log"

  - name: set_rfe
    type: set_fact
    vars:
      rfe_key: "{% if run.mode == 'batch' %}batch-discover{% else %}{{ seed.rfes.0.key }}{% endif %}"
      batch_expected_keys: "{{ seed.discovered_in_order | join:' ' }}"

  # The design itself, as it is: one script job, nothing between it and its output.
  # Each arm's job request is its own workflow, submit-<arm> (workflows/submit-*.yaml).
  - name: submit
    description: "Submit the arm's dashboard job: submit-workflow (PR #83) or submit-bash (PR #80)"
    workflow: "submit-{{ test.arm }}"
    # The arms this step can run; an arm in vars/arms.yaml without its workflow fails here.
    workflow_names: [submit-workflow, submit-bash]
    register: submitted

  - name: set_job
    type: set_fact
    vars:
      job_name: "{{ submitted.job.body.job_name }}"

  - name: wait_for_run
    description: "A failed job is a failed test: record it and go on to the checks"
    type: job_wait
    ignore_errors: true
    params:
      job_name: "{{ job_name }}"
      timeout: "{{ job_timeout }}"
    register: run_job

  - name: stop_unfinished_run
    description: "Stop a job still going at the timeout, before the next run resets Jira under it"
    when: "run_job.failed and run_job.status != 'failed'"
    type: dashboard_api
    params:
      path: "/api/jobs/{{ job_name }}/stop"
      method: POST
      body: {}

  - name: check
    description: "Script checks on Jira and the job, plus usage from the API dumps: the run's eval-result"
    type: bench_script
    params:
      path: check_run.py
      args: ["{{ run | to_json }}", "{{ job_name }}", "{{ rfe_key }}", "{{ run_job.status }}", "{{ seed | to_json }}"]
    register: eval

  - name: load_eval_result
    type: set_fact
    vars:
      eval_result: "{{ eval.stdout | from_json }}"

  - name: save_eval_result
    description: "Keep the eval-result next to the job's own artifacts"
    type: write_file
    params:
      path: "{{ artifacts_dir }}/scripts/{{ job_name }}/eval-result.json"
      content: "{{ eval_result }}"
      mode: "0664"
