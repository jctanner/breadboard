# Fictional benchmark RFE. Concern: secret lifecycle for project connections.
summary: Rotate project storage connection credentials with consumer readiness status
description: |
  h2. Problem Statement

  A project storage connection can be referenced by workbenches, pipeline
  workloads and model-serving resources. When its credentials expire, an owner
  must update the secret and work out which consumers need a restart or
  reconciliation. Some consumers keep cached credentials, so a successful
  secret update can leave the project only partly operational. Owners cannot
  tell when it is safe to revoke the old credential.

  h2. Desired Outcome

  An authorized connection owner can stage replacement credentials, validate
  access to the configured storage target and activate a new credential
  revision. The connection shows which supported consumers have adopted that
  revision and which still require action. The owner receives a clear readiness
  result before revoking the previous credential in the external storage system.

  h2. Acceptance Criteria

  * A connection editor can stage replacement credentials without exposing their values through ordinary connection reads, status or logs
  * Validation checks access to the connection's existing storage target without altering stored project data; a failed validation leaves the active revision unchanged
  * Activation records a new connection revision and identifies supported consuming resources in the same project
  * Each supported consumer reports the revision it has adopted or an explicit pending, restart-required or failed status
  * The UI and API expose aggregate readiness and actionable failures without claiming that an unverified consumer has rotated successfully
  * Concurrent editors cannot silently overwrite each other's rotation; updates require the expected connection revision
  * Activation and validation attempts record actor, time, connection identity and outcome while excluding credential values
  * Unsupported consumers are listed explicitly, and existing connections remain usable without opting into managed rotation

  h2. User Stories

  * As a connection owner, I want to know whether my workloads adopted replacement credentials before I revoke the old ones.
  * As a security administrator, I want an audit record of credential rotation without secret material in the audit trail.

  h2. Scope

  This request manages credentials for an existing project storage connection.
  It does not introduce a new external secret service, rotate identity-provider
  accounts or change project authorization policy. Revoking the old credential
  at the storage provider remains an explicit owner action.

  h2. Technical Notes

  Ground the design in the actual connection and Kubernetes Secret conventions
  in the architecture context. Distinguish consumers that reload credentials
  from those requiring a restart. The strategy must define what can be verified
  before activation and how revision status is obtained without granting broader
  access to secrets or other namespaces.
