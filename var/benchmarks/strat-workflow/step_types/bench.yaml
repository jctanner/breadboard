bench_script:
  base: script_exec
  description: "One of this benchmark's runner-side scripts (scripts/), with the dashboard and Jira settings"
  params:
    interpreter: python3
    env:
      DASHBOARD_BASE: "{{ dashboard_base }}"
      JIRA_BASE: "{{ jira_base }}"
      JIRA_USER: "{{ jira_user }}"
      JIRA_TOKEN: "{{ jira_token }}"
