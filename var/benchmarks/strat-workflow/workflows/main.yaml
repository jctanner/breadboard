name: main
description: "strat-creator design benchmark: run a tier's tests in rounds, check each run, summarize"

steps:
  - name: resolve_settings
    description: "The Breadboard commit the jobs clone from: breadboard_ref, or the commit markovd imported"
    type: set_fact
    vars:
      bench_ref: "{{ breadboard_ref | default:workflow_source_commit }}"

  - name: check_settings
    type: assert
    that:
      - "bench_ref | length == 40"
      - "tiers[tier].tests"
    msg: "Needs a pushed 40-character Breadboard commit (breadboard_ref, or workflow_source_commit from markovd) and a tier defined in vars/tiers.yaml"

  - name: check_single_test_settings
    description: "Each tier 2 pass requires one explicitly selected design, one matching-model run, and retained evidence"
    when: "tiers[tier].single_test"
    type: assert
    that:
      - "only_tests == 'S1' or only_tests == 'S2'"
      - "repeats == '' or repeats == 1 or repeats == '1'"
      - "repeats | default:tiers[tier].repeats | seq | length == 1"
      - "not variants or variants == tiers[tier].variant"
      - "not wipe_at_start"
    msg: "Tier 2 needs only_tests=S1 (or S2 after review), repeats=1, variants={{ tiers[tier].variant }}, and wipe_at_start=false; it never sweeps both designs"

  - name: list_running_jobs
    description: "A reset or a new test would pull Jira and files out from under a job still going"
    type: dashboard_api
    params:
      path: /api/jobs?status=running
      method: GET
    register: running_jobs

  - name: list_pending_jobs
    type: dashboard_api
    params:
      path: /api/jobs?status=pending
      method: GET
    register: pending_jobs

  - name: find_active_pipeline_jobs
    description: "Only pipeline jobs (they have a phase); the namespace's other Jobs, such as this Markov run's own runner and Org Pulse's cron jobs, don't count"
    type: set_fact
    vars:
      active_pipeline_jobs: "{% for j in running_jobs.body %}{% if j.phase %}{{ j.name }} {% endif %}{% endfor %}{% for j in pending_jobs.body %}{% if j.phase %}{{ j.name }} {% endif %}{% endfor %}"

  - name: check_no_active_jobs
    type: assert
    that:
      - "not active_pipeline_jobs"
    msg: "Dashboard pipeline jobs are still pending or running; wait for them or stop them first"

  - name: require_archives_before_wipe
    description: "Verify prior runs were collected on the host before clearing evidence"
    type: bench_script
    params:
      path: require_archive.py
      args: ["{{ archive_required_since }}"]

  - name: wipe
    description: "Clear the artifacts volume, MLflow and Observatory once, before the first run"
    when: "wipe_at_start"
    workflow: wipe

  - name: rounds
    description: "Every test once per round, so the designs alternate instead of running back to back"
    for_each: "repeats | default:tiers[tier].repeats | seq"
    as: round
    concurrency: 1
    workflow: round
    register: rounds_done

  - name: summarize
    description: "One table row per run and one per test, from every run's eval-result"
    type: bench_script
    params:
      path: summarize.py
      stdin: "{{ rounds_done | pluck:'tests_done' | flatten | pluck:'variants_done' | flatten | pluck:'eval_result' }}"
    register: summary

  - name: save_summary
    description: "Keep the summary with the run's results on the artifacts volume"
    type: write_file
    params:
      path: "{{ artifacts_dir }}/benchmarks/strat-workflow/{{ markov_run_id }}/summary.md"
      content: "{{ summary.stdout }}"
      mode: "0664"
      dir_mode: "2775"

  - name: save_results
    type: write_file
    params:
      path: "{{ artifacts_dir }}/benchmarks/strat-workflow/{{ markov_run_id }}/eval-results.json"
      content: "{{ rounds_done | pluck:'tests_done' | flatten | pluck:'variants_done' | flatten | pluck:'eval_result' }}"
      mode: "0664"
      dir_mode: "2775"

  - name: review
    description: "Pause for review when review_stop is set; resume with reviewed=true"
    type: gate
    rules:
      - review_stop
